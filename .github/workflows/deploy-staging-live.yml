name: CD - IUM Staging LIVE

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Ketik DEPLOY untuk konfirmasi deployment staging"
        required: true
        type: string
      expected_sha:
        description: "Full commit SHA reviewed and approved for this deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ium-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Laravel and Vite to Staging
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Validate deployment destination and approved SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = toscana.id.rapidplex.com
          test "$SSH_PORT" = 64000
          test "$SSH_USER" = desawi41
          test "$DEPLOY_PATH" = /home/desawi41/ium-staging/laravel-envision
          test "$EXPECTED_SHA" = "$GITHUB_SHA"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s public/build/manifest.json
          cd public/build
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/ium-build-sha256sums"
          mv "$RUNNER_TEMP/ium-build-sha256sums" SHA256SUMS

      - name: Configure SSH
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/ium_staging_actions"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Verify staging and prepare isolated asset directory
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ium_staging_actions" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -se -- prepare '$GITHUB_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" \
            < .github/scripts/staging-live.sh

      - name: Upload Vite assets to prepared directory
        run: |
          set -euo pipefail
          INCOMING="/home/desawi41/ium-staging/.ium-vite-incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rsync -az \
            -e "ssh -i $HOME/.ssh/ium_staging_actions -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            public/build/ "$SSH_USER@$SSH_HOST:$INCOMING/build/"

      - name: Back up, activate and migrate staging
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ium_staging_actions" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash -se -- activate '$GITHUB_SHA' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" \
            < .github/scripts/staging-live.sh
