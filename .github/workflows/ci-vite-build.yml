
name: CI - IUM Vite Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Verify build
        run: |
          test -s public/build/manifest.json
          test -d public/build/assets
          echo "Vite build verified"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ium-vite-build
          path: public/build/
          retention-days: 7
          if-no-files-found: error
